<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1630">
  <meta name="description" content="Tonight: Berlin night shelters report their free beds live, so nobody walks to a full shelter.">
  <title>Tonight · Free beds in Berlin night shelters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="logo" aria-hidden="true"><span></span></div>
      <h1>Tonight</h1>
    </header>

    <p class="pitch">Night shelters in Berlin report their free beds live, so nobody walks across the city to a shelter that is already full.</p>

    <p class="live" id="live" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="live-text">Loading free beds…</span>
    </p>

    <!-- Entry links are rendered from ENTRIES in home.js; add new pages there. -->
    <nav class="entries" id="entries" aria-label="Pages"></nav>

    <footer class="note">Demo: bed numbers are examples. Shelters: Berliner Kältehilfe, Nov 2026.</footer>
  </main>

  <script src="/shared/status.js"></script>
  <script type="module" src="/home.js"></script>
</body>
</html>
