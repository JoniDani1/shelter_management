<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonight · Free beds Berlin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <main class="board">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span></span></div>
        <h1>Free beds tonight</h1>
      </div>
      <div class="demo" title="Real shelters, but the free-bed numbers are examples">Demo</div>
      <div id="time" class="clock">--:--</div>
    </header>

    <section class="main" aria-live="polite">
      <ol id="rows" class="rows"></ol>
    </section>

    <section id="nobeds" class="nobeds" hidden>
      <h2>No beds now</h2>
      <p id="nobeds-list"></p>
    </section>

    <footer class="bottom">
      <span id="conn" class="conn">Connecting…</span>
      <span class="note">Demo: bed numbers are examples. Shelters: Berliner Kältehilfe, Nov 2026. Admission depends on the shelter.</span>
      <span id="pages" class="pages" aria-hidden="true"></span>
    </footer>
  </main>

  <script src="/shared/status.js"></script>
  <script type="module" src="board.js"></script>
</body>
</html>
